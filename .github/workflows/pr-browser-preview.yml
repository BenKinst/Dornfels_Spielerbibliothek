name: PR Seitencheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [infra/pr-browser-preview-checks]

permissions:
  contents: read

jobs:
  seitencheck:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Heiler-Testseite und Datenquelle prüfen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("charaktere/heiler-komponenten-test.html")
          data = Path("content/heiler-komponenten-test.md")

          for path in (page, data):
              if not path.is_file():
                  raise SystemExit(f"Datei fehlt: {path}")

          html = page.read_text(encoding="utf-8")
          expected = 'data-profile-src="../content/heiler-komponenten-test.md"'
          if expected not in html:
              raise SystemExit("Die Profilseite verweist nicht auf die erwartete Markdown-Datenquelle.")

          print("OK: Testseite und Markdown-Datenquelle sind vorhanden und korrekt miteinander verknüpft.")
          PY
