name: PR Seitencheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [infra/pr-browser-preview-checks]

permissions:
  contents: read

jobs:
  seitencheck:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Zauberer-Testseite und Datenquellen prüfen
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          page = Path("charaktere/zauberer-json-test.html")
          profile = Path("content/zauberer.json")
          background = Path("content/zauberer.md")
          color_script = Path("assets/eigenschaftsfarben.js")
          spell_lexicon = Path("content/zauberlexikon.json")

          for path in (page, profile, background, color_script, spell_lexicon):
              if not path.is_file():
                  raise SystemExit(f"Datei fehlt: {path}")

          html = page.read_text(encoding="utf-8")
          for expected in (
              'data-profile-src="../content/zauberer.json"',
              'data-background-src="../content/zauberer.md"',
              '<script src="../assets/eigenschaftsfarben.js"></script>',
              'data-spell-lexicon-src="../content/zauberlexikon.json"',
          ):
              if expected not in html:
                  raise SystemExit(f"Verknüpfung fehlt auf der Zauberer-Testseite: {expected}")

          data = json.loads(profile.read_text(encoding="utf-8"))
          if data.get("schemaVersion") != 1 or data.get("profile", {}).get("name") != "Der Zauberer":
              raise SystemExit("Die JSON-Profilquelle hat nicht die erwartete Grundstruktur für den Zauberer.")

          lexicon = json.loads(spell_lexicon.read_text(encoding="utf-8"))
          if lexicon.get("schemaVersion") != 1 or not isinstance(lexicon.get("spells"), list):
              raise SystemExit("Das zentrale Zauberlexikon hat nicht die erwartete Struktur.")
          for group in data.get("magic", {}).get("spellGroups", []):
              for spell in group.get("spells", []):
                  if not spell.get("lexiconId"):
                      raise SystemExit("Zauber ohne lexiconId: " + str(spell.get("name")))
          print("OK: Zauberer-Testseite, Profil, Hintergrund und zentrales Zauberlexikon sind korrekt verknüpft.")
          PY

      - name: Zauber-IDs und Lexikoneinträge synchron prüfen
        run: node scripts/sync-spell-lexicon.mjs --check
