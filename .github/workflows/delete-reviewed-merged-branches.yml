            {
            "name": "feature/website-grundgeruest",
            "sha": "a7c24673e2c845acdbf25097f392ba756caa49ef"
            }
            ];
            const deleted = [];
            const skipped = [];
            for (const branch of candidates) {
              try {
                const ref = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch.name}`
                });
                if (ref.data.object.sha !== branch.sha) {
                  skipped.push({ name: branch.name, reason: "head SHA changed" });
                  continue;
                }
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch.name}`
                });
                deleted.push(branch.name);
              } catch (error) {
                if (error.status === 404) {
                  skipped.push({ name: branch.name, reason: "branch no longer exists" });
                } else {
                  throw error;
                }
              }
            }
            core.info(`Deleted ${deleted.length} branches; skipped ${skipped.length}.`);
            core.summary.addHeading("Branch cleanup result");
            core.summary.addRaw(`Deleted: ${deleted.length}; skipped: ${skipped.length}`);
            if (skipped.length) core.summary.addCodeBlock(JSON.stringify(skipped, null, 2), "json");
            await core.summary.write();
