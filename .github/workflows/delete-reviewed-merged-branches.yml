name: Delete reviewed merged branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/delete-reviewed-merged-branches.yml'

permissions:
  contents: write

jobs:
  delete-reviewed-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only branches whose heads are unchanged
        uses: actions/github-script@v7
        with:
          script: |
